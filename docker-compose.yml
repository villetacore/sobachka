services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sobachka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: sobachka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sobachka"]
      interval: 5s
      retries: 20

  ml:
    build: ./ml
    restart: unless-stopped
    environment:
      TORCH_THREADS: ${TORCH_THREADS:-2}
      SELF_TRAIN_INTERVAL_MIN: ${SELF_TRAIN_INTERVAL_MIN:-30}
    volumes:
      - models:/models   # веса нейросети и память заказов для самообучения

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_started }
    environment:
      DATABASE_URL: postgres://sobachka:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/sobachka?sslmode=disable
      ML_URL: http://ml:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?задайте APP_SECRET_KEY в .env}
      PUBLIC_URL: ${PUBLIC_URL:?задайте PUBLIC_URL в .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

      NOTIFY_MAX_AGE_MIN: ${NOTIFY_MAX_AGE_MIN:-360}
      RETRAIN_EVERY: ${RETRAIN_EVERY:-10}
      PRESETS_FILE: /config/presets.json
    volumes:
      - ./config:/config:ro   # готовые площадки установки (presets.json, в git не попадает)

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  pgdata:
  models:

